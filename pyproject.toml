[project]
name = "earnings-call-sentiment"
version = "0.1.0"
description = "Does the tone of an earnings call Q&A predict the drift that follows?"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "yfinance>=0.2.40",
    "torch>=2.2",
    "transformers>=4.40",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["earnings", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
